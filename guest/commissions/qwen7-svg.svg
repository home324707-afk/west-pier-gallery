<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="stormDamage" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" result="turbulence"/>
      <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="skyblue"/>
  <path d="M100 450 Q200 150 300 450" stroke="brown" stroke-width="10" fill="none"/>
  <path d="M700 450 Q600 150 500 450" stroke="brown" stroke-width="10" fill="none"/>
  <rect x="150" y="350" width="100" height="100" fill="grey" filter="url(#stormDamage)"/>
  <rect x="550" y="350" width="100" height="100" fill="grey" filter="url(#stormDamage)"/>
  <rect x="250" y="150" width="100" height="100" fill="grey" filter="url(#stormDamage)"/>
  <rect x="650" y="150" width="100" height="100" fill="grey" filter="url(#stormDamage)"/>
  <circle cx="400" cy="250" r="50" fill="blue" opacity="0.5"/>
  <text x="400" y="300" font-family="Arial" font-size="20" fill="white">West Pier</text>
  <text x="200" y="480" font-family="Arial" font-size="14" fill="black">Damage</text>
  <text x="600" y="480" font-family="Arial" font-size="14" fill="black">Damage</text>
</svg>
