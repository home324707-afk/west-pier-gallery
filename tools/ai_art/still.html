<canvas id="c"></canvas><script>
window.render=async(o)=>{const c=document.getElementById('c');c.width=o.w;c.height=o.h;c.dataset.anim=o.anim;c.dataset.p=JSON.stringify(o.p||{});c.dataset.src=o.src||'';c.dataset.full='1';c.dataset.w=o.w;c.dataset.h=o.h;

 return await WPAI.still(c,o.ms||5000)};
</script></body></html>
